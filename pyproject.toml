[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-firewall"
version = "1.0.0"
description = "A real-time monitoring and authorization firewall for Model Context Protocol (MCP) communication in Claude Desktop and Claude Web"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MCP Firewall Team"}
]
keywords = ["mcp", "model-context-protocol", "claude", "security", "firewall", "interceptor", "authorization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = []

[project.scripts]
mcp-firewall = "mcp_firewall.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_firewall*"]
